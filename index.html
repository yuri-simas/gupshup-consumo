<title>Impacto WhatsApp por Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0E1720; --ink-2:#3D4C5A; --ink-3:#7C8B99;
  --paper:#FFFFFF; --surface:#F2F5F7; --line:#DCE2E7;
  --petrol:#4B5E86; --petrol-2:#5C73A4; --petrol-3:#95A4C3; --petrol-soft:#EBEEF4;
  --signal:#7D437A; --signal-soft:#F2ECF1;
  --good:#2F6B34; --good-soft:#E9F1E7;
  --warn:#5D5385;
  --orpen-navy:#1A293E; --orpen-magenta:#7D437A; --orpen-violet:#6F6399; --orpen-blue:#5C73A4;
  --orpen-grad:linear-gradient(100deg,#7D437A 0%,#6F6399 52%,#5C73A4 100%);
}
*{box-sizing:border-box}
body{
  background:#0A1118; color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:16px; line-height:1.6;
  margin:0; -webkit-font-smoothing:antialiased;
}

/* ---------- barra de controle ---------- */
.bar{
  position:sticky; top:0; z-index:40; background:#0A1118;
  border-bottom:1px solid #22313F; padding:9px 16px;
  display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center;
}
.bar label{display:flex;align-items:center;gap:6px}
.bar .lb{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:#7C8B99; white-space:nowrap;
}
.bar select,.bar input{
  font:inherit; font-size:12.5px; background:#131E29; color:#DCE6ED;
  border:1px solid #2B3B4A; border-radius:5px; padding:5px 8px;
}
.bar select{max-width:340px}
.bar select#addSel{max-width:210px}
.bar input.n{font-family:"IBM Plex Mono",monospace;width:74px;text-align:right}
.bar input.t{width:190px}
.bar button,.bar a.lnk{
  font:inherit; font-size:12.5px; font-weight:500; cursor:pointer;
  background:#131E29; color:#DCE6ED; border:1px solid #2B3B4A;
  border-radius:5px; padding:5px 11px; text-decoration:none; white-space:nowrap;
}
.bar button:hover,.bar a.lnk:hover{background:#1B2836;border-color:#43596E}
.bar button.go{background:var(--orpen-magenta);border-color:var(--orpen-magenta);color:#fff}
.bar button.go:hover{background:#8E4F8B;border-color:#8E4F8B}
.cb{position:relative}
.cb input.q{width:236px}
.cb ul{
  position:absolute; top:calc(100% + 5px); left:0; z-index:60; margin:0; padding:4px;
  background:#0E1822; border:1px solid #2B3B4A; border-radius:7px; list-style:none;
  min-width:360px; max-height:330px; overflow-y:auto; box-shadow:0 14px 36px rgba(0,0,0,.55);
}
.cb ul[hidden]{display:none}
.cb li{padding:6px 9px;border-radius:5px;cursor:pointer}
.cb li b{display:block;font-size:12.5px;color:#DCE6ED;font-weight:500}
.cb li i{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#7C8B99;margin-top:1px}
.cb li[aria-selected="true"],.cb li:hover{background:#1B2836}
.cb li mark{background:rgba(125,67,122,.5);color:#F4DCF2;border-radius:2px;padding:0 1px}
.cb .msg{padding:9px 10px;color:#7C8B99;font-size:11.5px;font-family:"IBM Plex Mono",monospace}
.cb ul::-webkit-scrollbar{width:8px}
.cb ul::-webkit-scrollbar-track{background:#0E1822}
.cb ul::-webkit-scrollbar-thumb{background:#2B3B4A;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:#DCE6ED;
  background:#1B2836; border:1px solid #2B3B4A; border-radius:12px;
  padding:2px 5px 2px 9px; display:inline-flex; align-items:center; gap:5px;
}
.chip b{font-weight:500}
.chip button{background:none;border:none;color:#7C8B99;padding:0 4px;font-size:13px;line-height:1;cursor:pointer}
.chip button:hover{color:#E8A0A0;background:none;border:none}
:focus-visible{outline:2px solid var(--orpen-magenta);outline-offset:2px}

/* ---------- deck ---------- */
.deck{scroll-snap-type:y mandatory;overflow-y:auto;height:calc(100vh - 45px)}
.slide{
  scroll-snap-align:start; min-height:calc(100vh - 45px); background:var(--paper);
  padding:clamp(28px,4.4vh,56px) clamp(22px,5vw,80px) clamp(60px,7vh,80px);
  display:flex; flex-direction:column; justify-content:center;
  position:relative; border-bottom:1px solid #0A1118;
}
.slide.dark{background:var(--orpen-navy);color:#fff}
.inner{width:100%;max-width:1120px;margin:0 auto}
.orpen-logo{
  position:absolute; top:clamp(24px,4vh,44px); right:clamp(22px,5vw,80px);
  width:52px; height:52px; border-radius:11px; z-index:3;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);
}
.slide::after{
  content:attr(data-n) " / " attr(data-of); position:absolute; bottom:22px; right:clamp(22px,5vw,80px);
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-3);
}
.slide.dark::after{color:#5C7180}
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--petrol); margin:0 0 14px; display:block;
}
.slide.dark .tag{color:#B98FC4}
h1{font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(30px,5.2vw,58px);line-height:1.03;
  letter-spacing:-.028em;margin:0 0 20px;max-width:18ch}
h2{font-family:Archivo,sans-serif;font-weight:600;font-size:clamp(23px,3.4vw,38px);line-height:1.1;
  letter-spacing:-.022em;margin:0 0 12px;max-width:23ch}
h3{font-family:Archivo,sans-serif;font-weight:600;font-size:clamp(15px,1.7vw,19px);margin:0 0 8px;letter-spacing:-.01em}
.sub{font-size:clamp(14px,1.5vw,17px);color:var(--ink-2);max-width:70ch;margin:0 0 4px}
.slide.dark .sub{color:#AEBFCA}
p{margin:0 0 12px}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:26px}
.figs>div{background:var(--paper);padding:20px 22px}
.slide.dark .figs{background:#243441;border-color:#243441}
.slide.dark .figs>div{background:var(--orpen-navy)}
.figs .l{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px}
.figs .v{font-family:Archivo,sans-serif;font-size:clamp(25px,3.2vw,34px);font-weight:600;letter-spacing:-.025em;line-height:1;margin:0}
.figs .s{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.slide.dark .figs .s{color:#94A8B5}
.up{color:var(--signal)} .down{color:var(--good)}

.spine{display:flex;height:44px;border-radius:3px;overflow:hidden;margin:24px 0 10px;border:1px solid var(--line)}
.spine div{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;
  font-size:11px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden}

.tw{overflow-x:auto;margin:20px 0 6px}
.tw.scroll{max-height:min(44vh,400px);overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:16px}
.tw.scroll table{margin:0;min-width:600px}
.tw.scroll thead th{position:sticky;top:0;background:var(--paper);z-index:2;padding:12px 14px 9px 14px}
.tw.scroll td{padding:9px 14px}
.tw.scroll::-webkit-scrollbar{width:8px}
.tw.scroll::-webkit-scrollbar-track{background:var(--surface)}
.tw.scroll::-webkit-scrollbar-thumb{background:var(--petrol-3);border-radius:8px}
.scroll-hint{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);text-align:center;padding:7px 0 0;margin:0}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;font-weight:500;padding:0 14px 9px 0;border-bottom:1px solid var(--ink)}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;padding-right:0}
.tw.scroll td.num,.tw.scroll th.num{padding-right:14px}
tr.hi td{background:var(--petrol-soft)}
tr.tot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:24px}
.card{border:1px solid var(--line);border-top:3px solid var(--warn);padding:18px 20px}
.card .t{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--warn);margin:0 0 7px}
.card p{font-size:13.5px;color:var(--ink-2);margin:0 0 9px}
.card p:last-child{margin:0}

.note{border:1px solid var(--line);background:var(--surface);padding:16px 20px;margin-top:22px;font-size:13.5px;color:var(--ink-2)}
.note b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink);display:block;margin-bottom:7px}
.note.warn{background:var(--signal-soft);border-color:#DACAD9}
.note.warn b{color:var(--signal)}
.note.ok{background:var(--good-soft);border-color:#CFE0CC}
.note.ok b{color:var(--good)}
.note p{margin:0 0 9px} .note p:last-child{margin:0}

.rank{margin-top:22px;border-top:1px solid var(--line)}
.rw{display:grid;grid-template-columns:24px 1.25fr 2.4fr auto;gap:16px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rw .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.rw .nm{font-weight:500;font-size:14.5px}
.rw .nm small{display:block;font-weight:400;color:var(--ink-3);line-height:1.35;margin-top:1px}
.trk{background:var(--surface);height:8px;border-radius:2px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--petrol)}
.rw .amt{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500;text-align:right;white-space:nowrap}
.rw .amt small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}

.meta{display:flex;flex-wrap:wrap;gap:7px 26px;margin-top:30px;padding-top:18px;border-top:1px solid #243441;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.07em;color:#7C8B99;text-transform:uppercase}
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:#7C8B99;
  background:rgba(10,17,24,.86);padding:6px 14px;border-radius:20px;text-transform:uppercase}

@media (max-width:680px){
  .rw{grid-template-columns:20px 1fr auto;gap:9px} .rw .trk{display:none}
  .slide{justify-content:flex-start;padding-top:44px}
  .hint{display:none}
  .bar select{max-width:100%;flex:1}
}
@media print{
  body{background:#fff}
  .bar,.hint{display:none!important}
  .deck{height:auto;overflow:visible}
  .slide{min-height:auto;page-break-after:always;break-after:page;border:0;padding:24px 30px}
  .tw.scroll{max-height:none;overflow:visible;border:0}
  .slide.dark{background:#1A293E!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
(function(){
"use strict";

/* registro:
   0 app  1 appId  2 cid  3 sOut  4 sIn  5 tmpl  6 mkt  7 utilPaid  8 utilFree
   9 auth  10 freeEntry  11 mmlite  12 voiceIn  13 gFee  14 gMkt  15 wFee
   16 disc  17 total  18 svc                                              */

var DATA = JSON.parse(document.getElementById("seed").textContent);
var LOGO = document.getElementById("logo").textContent.trim();

var MESES = 3;            /* extrato de 90 dias */
var TETO  = 75;           /* teto Gupshup por app, por mês */
var R_MKT = 0.0625, R_UTIL = 0.0068;
var st = {sel:[], nome:"", rSvc:0.0068, fx:5.12};

var fU = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
var fU0= new Intl.NumberFormat("pt-BR",{style:"currency",currency:"USD",minimumFractionDigits:0,maximumFractionDigits:0});
var fB = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:0,maximumFractionDigits:0});
var fN = new Intl.NumberFormat("pt-BR");
function usd(v){ return fU.format(v); }
function usd0(v){ return fU0.format(v); }
function brl(v){ return fB.format(v*st.fx); }
var fB2 = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
function brl2(v){ return fB2.format(v*st.fx); }
function int(v){ return fN.format(Math.round(v)); }
function pc(v){ return (v*100).toFixed(1).replace(".",",")+"%"; }
function mult(v){ return v.toFixed(1).replace(".",",")+"x"; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---- números de um app, já em média mensal ---- */
function appCalc(r){
  var gRaw   = r[13] / MESES;                       /* taxa Gupshup cheia */
  var gBill  = Math.min(r[13], TETO*MESES) / MESES; /* com o teto mensal  */
  var gMkt   = r[14] / MESES;
  var tmplNow= r[15] / MESES;                       /* templates já pagos hoje */
  var svcNew = (r[18]*st.rSvc + r[8]*R_UTIL) / MESES; /* serviço + utility em janela */
  var hoje   = gBill + gMkt + tmplNow;
  return {
    app:r[0], cid:r[2], sOut:r[3]/MESES, svc:r[18]/MESES,
    gRaw:gRaw, gBill:gBill, gMkt:gMkt, gEcon:gRaw-gBill,
    tmpl:tmplNow, svcNew:svcNew,
    hoje:hoje, out:hoje+svcNew,
    capped:r[13] > TETO*MESES
  };
}

/* ---- agrega a seleção ---- */
function build(){
  var apps = DATA.filter(function(r){ return st.sel.indexOf(r[2]) > -1; }).map(appCalc);
  apps.sort(function(a,b){ return b.out - a.out; });
  var T = {gBill:0,gMkt:0,gEcon:0,gRaw:0,tmpl:0,svcNew:0,hoje:0,out:0,sOut:0,svc:0,capped:0};
  apps.forEach(function(a){
    T.gBill+=a.gBill; T.gMkt+=a.gMkt; T.gEcon+=a.gEcon; T.gRaw+=a.gRaw;
    T.tmpl+=a.tmpl; T.svcNew+=a.svcNew; T.hoje+=a.hoje; T.out+=a.out;
    T.sOut+=a.sOut; T.svc+=a.svc; if(a.capped) T.capped++;
  });
  T.mult = T.hoje > 0 ? T.out/T.hoje : 0;
  T.gup  = T.gBill + T.gMkt;
  return {apps:apps, T:T};
}

/* ---------------- slides ---------------- */
function render(){
  if(!st.sel.length){ document.getElementById("deck").innerHTML = ""; return; }
  var b = build(), A = b.apps, T = b.T, N = 6;
  var nome = st.nome || (A[0] ? A[0].app : "Cliente");
  var multi = st.sel.length > 1;
  var s = [];

  /* 01 capa */
  s.push(slide(1,N,true,
    '<img class="orpen-logo" src="'+LOGO+'" alt="Orpen">'
    + tag("Orpen · Análise interna · Setembro 2026")
    + '<h1>'+esc(nome)+': o impacto da mudança do WhatsApp em outubro</h1>'
    + '<p class="sub">A partir de 01/10/2026 a Meta passa a cobrar as mensagens de serviço — as respostas de texto livre dentro da janela de 24h — na tarifa de Utilidade. '
    + (T.capped > 0
        ? 'Aqui há um agravante: o limite da Gupshup, que hoje segura a taxa por mensagem em US$ 75 por app, não alcança essa nova cobrança.'
        : 'O peso da mudança depende de quanto do tráfego é atendimento e quanto já é template pago hoje.')

/* ---- índice de busca: um registro por app ---- */
function norm(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
}
var APPS = DATA.map(function(r){
  return {app:r[0], appId:r[1], cid:r[2], tot:r[17], n:norm(r[0]+" "+r[2]+" "+r[1])};
});
var LIMITE = 40;

/* Todos os termos digitados precisam aparecer. Ordena por: começa com o termo,
   depois contém, depois pelo custo do app. */
function buscar(q){
  var nq = norm(q).trim();
  if(!nq){
    return {itens: APPS.slice().sort(function(a,b){ return b.tot-a.tot; }).slice(0,LIMITE), total:APPS.length, vazio:true};
  }
  var termos = nq.split(/\s+/);
  var hits = [];
  APPS.forEach(function(a){
    for(var i=0;i<termos.length;i++){ if(a.n.indexOf(termos[i]) < 0) return; }
    var na = norm(a.app);
    hits.push({a:a, rank: na.indexOf(termos[0]) === 0 ? 0 : (na.indexOf(termos[0]) > -1 ? 1 : 2)});
  });
  hits.sort(function(x,y){ return x.rank - y.rank || y.a.tot - x.a.tot; });
  return {itens: hits.slice(0,LIMITE).map(function(x){ return x.a; }), total:hits.length, vazio:false};
}

function marcar(texto, q){
  var nq = norm(q).trim().split(/\s+/)[0];
  if(!nq) return esc(texto);
  var i = norm(texto).indexOf(nq);
  if(i < 0) return esc(texto);
  return esc(texto.slice(0,i)) + "<mark>" + esc(texto.slice(i, i+nq.length)) + "</mark>" + esc(texto.slice(i+nq.length));
}

/* ---- combobox reutilizável ---- */
function combo(rootId, aoEscolher){
  var raiz  = document.getElementById(rootId);
  var campo = raiz.querySelector("input");
  var lista = raiz.querySelector("ul");
  var itens = [], atual = -1;

  function abrir(){ lista.hidden = false; campo.setAttribute("aria-expanded","true"); }
  function fechar(){ lista.hidden = true; campo.setAttribute("aria-expanded","false"); atual = -1; }
  function desenhar(){
    var q = campo.value, r = buscar(q);
    itens = r.itens;
    if(!itens.length){
      lista.innerHTML = '<li class="msg" role="presentation">Nenhum app encontrado para “'+esc(q)+'”</li>';
      atual = -1; abrir(); return;
    }
    atual = 0;
    lista.innerHTML = itens.map(function(a,i){
      var c = byCid[a.cid];
      return '<li role="option" data-i="'+i+'" aria-selected="'+(i===0)+'">'
        + '<b>' + marcar(a.app, q) + '</b>'
        + '<i>' + esc(a.cid) + ' · ' + c.apps + ' app' + (c.apps>1?"s":"") + ' · ' + esc(usd0(c.total/MESES)) + '/mês</i>'
        + '</li>';
    }).join("")
    + (r.total > itens.length ? '<li class="msg" role="presentation">+ '+(r.total-itens.length)+' resultados — refine a busca</li>' : "");
    abrir();
  }
  function mover(d){
    if(lista.hidden || !itens.length) return;
    atual = (atual + d + itens.length) % itens.length;
    [].forEach.call(lista.querySelectorAll('li[role="option"]'), function(li,i){
      li.setAttribute("aria-selected", i === atual);
      if(i === atual) li.scrollIntoView({block:"nearest"});
    });
  }
  function escolher(i){
    var a = itens[i]; if(!a) return;
    campo.value = a.app;
    campo.blur(); fechar();
    aoEscolher(a);
  }

  campo.addEventListener("input", desenhar);
  campo.addEventListener("focus", function(){ this.select(); desenhar(); });
  campo.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){ e.preventDefault(); lista.hidden ? desenhar() : mover(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); mover(-1); }
    else if(e.key === "Enter"){ e.preventDefault(); if(!lista.hidden) escolher(atual); }
    else if(e.key === "Escape"){ e.preventDefault(); fechar(); this.blur(); }
  });
  lista.addEventListener("mousedown", function(e){
    var li = e.target.closest('li[role="option"]'); if(!li) return;
    e.preventDefault(); escolher(+li.dataset.i);
  });
  document.addEventListener("click", function(e){ if(!raiz.contains(e.target)) fechar(); });

  return {campo:campo, limpar:function(){ campo.value = ""; }, mostrar:function(v){ campo.value = v; }};
}

/* No visualizador de artifacts o arquivo vai pela capability downloads;

var dl = null;
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(d){ dl = d; }, function(){ dl = null; });
}
function baixar(texto, nome){
  var blob = new Blob([texto], {type:"text/html;charset=utf-8"});
  if(dl){
    dl.save({filename:nome, data:blob}).then(function(){}, function(err){
      if(err && err.code !== "declined") alert("Nao foi possivel salvar: " + (err.message || err.code));
    });
    return;
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------------- navegação ---------------- */
var idx = 0;
function slides(){ return [].slice.call(document.querySelectorAll(".slide")); }
function go(n){
  var s = slides(); if(!s.length) return;
  idx = Math.max(0, Math.min(s.length-1, n));
  s[idx].scrollIntoView({behavior:"smooth"});
}
document.addEventListener("keydown", function(e){
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(["ArrowDown","ArrowRight","PageDown"," "].indexOf(e.key) > -1){ e.preventDefault(); go(idx+1); }
  else if(["ArrowUp","ArrowLeft","PageUp"].indexOf(e.key) > -1){ e.preventDefault(); go(idx-1); }
  else if(e.key === "Home"){ e.preventDefault(); go(0); }
  else if(e.key === "End"){ e.preventDefault(); go(slides().length-1); }
  else if(e.key === "p" || e.key === "P"){ window.print(); }
});
var io = new IntersectionObserver(function(es){
  es.forEach(function(en){ if(en.isIntersecting) idx = slides().indexOf(en.target); });
}, {threshold:.5});
function wire(){ slides().forEach(function(s){ io.observe(s); }); }

render();
setTimeout(function(){
  var h = document.getElementById("hint");
  if(h){ h.style.transition = "opacity .6s"; h.style.opacity = "0"; }
}, 4600);
})();
</script>
